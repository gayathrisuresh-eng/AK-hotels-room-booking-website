{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <h1><mark>WELCOME TO LOGIN PAGE</mark></h1>
    <form method="POST">
    {% csrf_token %}
    <input name="username" type="text" class="form control mb-2" placeholder="username"><br><br>
    <input name="password" type="password" class="form control mb-2" placeholder="password"><br><br>
    <button class="btn btn-primary">Login</button>
    </form>
</div>
{% endblock %}
